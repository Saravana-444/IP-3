<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login -Online Shopping Cart</title>

    <style>
        body {
            /* Sets your image to fix, center, scale perfectly, and not repeat */
            background-image: url('bg2.jpeg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: lightblue; /* Fallback color */
            
            font-family: "Times New Roman", Times, serif;
            padding: 20px;
        }

        a {
            color: blue;
            text-decoration: none;
        }

        h3 {
            text-align: center;
            color: darkgreen;
        }

        table {
            background-color: white;
            border: 3px solid black;
            width: 350px;
            padding: 10px;
        }

        td {
            padding: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 150px;
            border: 2px solid green;
        }

        input[type="submit"] {
            background-color: green;
            color: white;
            border: 2px solid black;
            padding: 5px 15px;
        }

        .signup {
            color: red;
        }
    </style>
</head>

<body>

    <a href="front.html">Back to Home</a>

    <h3>LOGIN</h3>

    <form>
        <table align="center" border="4" cellpadding="8">
            <tr>
                <td>Enter the Username</td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td>Enter the Password</td>
                <td><input type="password" required></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <a href="user.html" class="signup">Signup</a>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
